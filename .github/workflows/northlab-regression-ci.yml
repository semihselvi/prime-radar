name: NorthLab Radar - Regression Tests (no live scans)

"on":
  push:
    branches:
      - repair/northlab-delivery-health-20261118
    paths:
      - "main.py"
      - "northlab_sales_radar.py"
      - "northlab_sales_source_hub.py"
      - "test_northlab_sales_radar.py"
      - ".github/workflows/northlab-regression-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "main.py"
      - "northlab_sales_radar.py"
      - "northlab_sales_source_hub.py"
      - "test_northlab_sales_radar.py"
      - ".github/workflows/northlab-regression-ci.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install existing production dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-ocean.txt
      - name: Compile and run NorthLab classifier, delivery and source-health tests
        run: |
          python -m py_compile main.py northlab_sales_radar.py northlab_sales_source_hub.py test_northlab_sales_radar.py
          python -m unittest -v test_northlab_sales_radar.py
