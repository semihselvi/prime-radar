name: NORTHLAB - ScrapeGraphAI Pilot CI

"on":
  pull_request:
    paths:
      - "northlab_sga_pilot.py"
      - "test_northlab_sga_pilot.py"
      - "docs/NORTHLAB_SCRAPEGRAPHAI_PILOT.md"
      - ".github/workflows/northlab-sga-pilot-ci.yml"
  workflow_dispatch:
    inputs:
      run_live:
        description: "Spend one Cloudflare Workers AI inference on the owned northlab.pro page"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and run offline tests
        run: |
          python -m py_compile northlab_sga_pilot.py
          python -m unittest -v test_northlab_sga_pilot.py
      - name: Verify dry-run without model or credentials
        run: |
          python northlab_sga_pilot.py
      - name: Fetch owned public page once (no AI, no secrets)
        run: |
          python - <<'PY'
          import northlab_sga_pilot as p
          source=p.fetch_owned_source()
          assert source.startswith("WEBPAGE TEXT")
          assert len(source) > 80
          print("Owned-page text retrieved, characters:", len(source))
          PY

  live-owned-page:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live == true
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require explicit Cloudflare AI secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
      - name: Install ScrapeGraphAI for one inference
        run: python -m pip install 'scrapegraphai>=2.1,<2.3'
      - name: Extract one approved public page
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SCRAPEGRAPHAI_TELEMETRY_ENABLED: "false"
        run: |
          python northlab_sga_pilot.py --run > northlab-sga-review.json
          python -c 'import json; d=json.load(open("northlab-sga-review.json")); assert d["status"] == "review_required" and not d["qualified_sales_lead"]'
      - name: Save report for manual review
        uses: actions/upload-artifact@v4
        with:
          name: northlab-sga-review
          path: northlab-sga-review.json
          retention-days: 2
