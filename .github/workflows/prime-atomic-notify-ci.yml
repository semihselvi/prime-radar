name: Prime - Atomic notification and buyer regression

"on":
  push:
    branches:
      - repair/prime-atomic-notify-20261118
    paths:
      - northlab_lead_radar_core.py
      - nc_v6_broad_radar.py
      - test_northlab_lead_radar_core.py
      - .github/workflows/prime-atomic-notify-ci.yml
  pull_request:
    branches: [production/radar]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install production dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute regression suite without Telegram credentials
        run: |
          python -m py_compile northlab_lead_radar_core.py nc_v6_broad_radar.py test_northlab_lead_radar_core.py
          python -m unittest -q test_northlab_lead_radar_core.py test_nc_v6_broad_radar.py test_prime_source_bootstrap.py test_audit_recent_buyers.py
