name: Prime Buyer Funnel - Read Only Audit
"on":
  push:
    branches:
      - audit/prime-buyer-funnel-20261118
    paths:
      - audit_prime_funnel.py
      - .github/workflows/prime-funnel-readonly-audit.yml
permissions:
  contents: read
jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit classification reasons without sending messages or modifying records
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python audit_prime_funnel.py
