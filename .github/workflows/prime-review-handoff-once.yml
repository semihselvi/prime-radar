name: Prime Manual Review Handoff - One Shot
"on":
  push:
    branches:
      - audit/prime-buyer-funnel-20261118
    paths:
      - .github/workflows/prime-review-handoff-once.yml
permissions:
  contents: read
jobs:
  private-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Deliver at most five MANUAL REVIEW candidates to existing admin Telegram chat
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m py_compile send_prime_private_review.py
          python send_prime_private_review.py
